[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mousectl"
version = "0.1.0"
description = "CLI para controlar ratones y periféricos compatibles con libratbag (ratbagd) vía DBus."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "andres2002002" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
]
dependencies = [
    "click>=8.1",
    "dbus-python>=1.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
mousectl = "mousectl.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/mousectl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "typings"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
